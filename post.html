<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#6d4aff" />
    <title>Post · SocialQuest</title>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="page-routing.css" />
    <style>
      body{margin:0;background:#f7f6fb;color:#24212f;font-family:Inter,system-ui,sans-serif}.post-page{max-width:760px;margin:0 auto;padding:18px 22px 72px}.post-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.post-top a{color:#6d4aff;text-decoration:none;font-weight:800}.post-card{background:#fff;border:1px solid #ebe9f2;border-radius:22px;overflow:hidden}.post-author{display:flex;align-items:center;gap:11px;padding:18px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#6d4aff;color:#fff;font-weight:800;background-size:cover;background-position:center}.post-author strong,.post-author small{display:block}.post-author small{margin-top:3px;color:#817c91}.post-body{padding:0 18px 18px;font-size:16px;line-height:1.55;white-space:pre-wrap}.post-media{background:#15131e;display:flex;justify-content:center}.post-media img,.post-media video{display:block;max-width:100%;max-height:640px;object-fit:contain}.post-tools{display:flex;gap:24px;padding:15px 18px;border-top:1px solid #ebe9f2}.post-tools button{border:0;background:none;color:#615b72;font:700 14px inherit;cursor:pointer}.post-tools button.liked{color:#e04161}.comments{margin-top:18px;background:#fff;border:1px solid #ebe9f2;border-radius:22px;padding:18px}.comments h2{margin:0 0 14px;font-size:17px}.comment{padding:13px 0;border-top:1px solid #f0eef5}.comment:first-of-type{border-top:0}.comment strong{font-size:14px}.comment p{margin:5px 0 0;line-height:1.45}.comment small{display:block;margin-top:6px;color:#938da1}.comment-form{display:flex;gap:9px;margin-top:14px;border-top:1px solid #ebe9f2;padding-top:14px}.comment-form input{flex:1;border:1px solid #ddd9e8;border-radius:10px;padding:11px;font:14px inherit}.comment-form button{border:0;border-radius:10px;background:#6d4aff;color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.empty,.error{padding:34px;text-align:center;color:#817c91}.error{color:#c73d57}@media(max-width:600px){.post-page{padding:14px 12px 78px}.post-card,.comments{border-radius:16px}.post-media img,.post-media video{max-height:480px}}
    </style>
  </head>
  <body>
    <main class="post-page">
      <header class="post-top"><a href="feed.html" aria-label="Back to home">← Back</a><a href="feed.html" class="brand">SocialQuest</a></header>
      <section id="postDetail" class="post-card"><p class="empty">Loading post…</p></section>
      <section class="comments"><h2>Comments</h2><div id="comments"><p class="empty">Loading comments…</p></div><form id="commentForm" class="comment-form" hidden><input id="commentText" maxlength="1000" placeholder="Write a comment…" required /><button type="submit">Post</button></form></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const db=window.supabase.createClient('https://tbvdrfgnvdarutapvqjl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRidmRyZmdudmRhcnV0YXB2cWpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjUyNDYsImV4cCI6MjEwNjI0MTI0Nn0.Dp2d-N2xWSXwqAWhiQVmspxpSYJPyX25tq1rj5JaHCw');
      const postId=new URLSearchParams(location.search).get('id');let currentUser=null,post=null;
      const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const initials=name=>String(name||'Q').split(/\s+/).map(part=>part[0]).join('').slice(0,2).toUpperCase();
      const ago=value=>{const seconds=Math.max(0,Math.floor((Date.now()-new Date(value))/1000));return seconds<60?'now':seconds<3600?Math.floor(seconds/60)+'m':seconds<86400?Math.floor(seconds/3600)+'h':Math.floor(seconds/86400)+'d';};
      const media=url=>{if(!url)return '';const isVideo=/\.(mp4|webm|mov)(?:$|\?)/i.test(url);return `<div class="post-media">${isVideo?`<video controls playsinline preload="metadata" src="${escapeHtml(url)}"></video>`:`<img src="${escapeHtml(url)}" alt="Post media" />`}</div>`;};
      async function loadComments(){const {data,error}=await db.from('comments').select('id,body,created_at,author:profiles!comments_author_id_fkey(display_name,username)').eq('post_id',postId).is('parent_id',null).order('created_at',{ascending:true});const box=document.querySelector('#comments');if(error){box.innerHTML='<p class="error">Comments could not be loaded.</p>';return;}box.innerHTML=(data||[]).length?data.map(comment=>`<article class="comment"><strong>${escapeHtml(comment.author?.display_name||'Quester')}</strong><p>${escapeHtml(comment.body)}</p><small>@${escapeHtml(comment.author?.username||'quester')} · ${ago(comment.created_at)}</small></article>`).join(''):'<p class="empty">No comments yet. Start the conversation.</p>';}
      async function toggleLike(){if(!currentUser)return location.href='index.html';const button=document.querySelector('#likePost');const {error}=await db.from('post_reactions').insert({post_id:postId,user_id:currentUser.id});if(error?.code==='23505'){const {error:removeError}=await db.from('post_reactions').delete().eq('post_id',postId).eq('user_id',currentUser.id);if(removeError)return;post.likes--;button.classList.remove('liked');button.textContent='♡ '+post.likes;return;}if(error)return;post.likes++;button.classList.add('liked');button.textContent='♥ '+post.likes;}
      async function loadPost(){if(!postId){document.querySelector('#postDetail').innerHTML='<p class="error">This post link is incomplete.</p>';return;}const {data,error}=await db.from('posts').select('id,author_id,body,image_url,created_at,author:profiles!posts_author_id_fkey(display_name,username,avatar_url),post_reactions(count),comments(count)').eq('id',postId).maybeSingle();if(error||!data){document.querySelector('#postDetail').innerHTML='<p class="error">This post is unavailable.</p>';return;}post={likes:data.post_reactions?.[0]?.count||0};const avatar=data.author?.avatar_url?`style="background-image:url('${escapeHtml(data.author.avatar_url)}')"`:'';document.querySelector('#postDetail').innerHTML=`<div class="post-author"><a class="avatar" ${avatar} href="profile.html?u=${encodeURIComponent(data.author?.username||'')}" aria-label="Open profile">${data.author?.avatar_url?'':initials(data.author?.display_name)}</a><div><strong>${escapeHtml(data.author?.display_name||'Quester')}</strong><small>@${escapeHtml(data.author?.username||'quester')} · ${ago(data.created_at)}</small></div></div><div class="post-body">${escapeHtml(data.body)}</div>${media(data.image_url)}<div class="post-tools"><button id="likePost">♡ ${post.likes}</button><button id="focusComment">◯ ${data.comments?.[0]?.count||0} comments</button><button id="sharePost">↗ Share</button></div>`;document.querySelector('#likePost').onclick=toggleLike;document.querySelector('#focusComment').onclick=()=>document.querySelector('#commentText')?.focus();document.querySelector('#sharePost').onclick=async()=>{const url=location.href;if(navigator.share)await navigator.share({title:'SocialQuest post',url});else{await navigator.clipboard.writeText(url);alert('Post link copied.');}};}
      document.querySelector('#commentForm').onsubmit=async event=>{event.preventDefault();if(!currentUser)return;const input=document.querySelector('#commentText'),body=input.value.trim();if(!body)return;const {error}=await db.from('comments').insert({post_id:postId,author_id:currentUser.id,body});if(error)return alert('Could not publish your comment.');input.value='';await loadComments();};
      (async()=>{const {data:{session}}=await db.auth.getSession();currentUser=session?.user||null;if(currentUser)document.querySelector('#commentForm').hidden=false;await Promise.all([loadPost(),loadComments()]);})();
    </script>
  </body>
</html>
